<title>Prumo — Painel</title>
<meta name="theme-color" content="#111113">
<style>html,body{background:#111113}.boot{position:fixed;inset:0;background:#111113;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}.boot-logo{width:64px;height:64px;border-radius:20px;background:#f97316;color:#fff;display:grid;place-items:center;font:800 32px sans-serif}.boot-spin{width:26px;height:26px;border:3px solid #2a2b30;border-top-color:#f97316;border-radius:50%;animation:bs .7s linear infinite}@keyframes bs{to{transform:rotate(360deg)}}</style>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prumo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

</head>

<div id="app"><div class="boot"><div class="boot-logo">P</div><div class="boot-spin"></div></div></div>

<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/automations.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>

</body>
</html>
